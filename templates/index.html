<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quadratic Equation Solver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Quadratic Equation Solver</h3>
                <div class="text-center mb-4">
                    <button id="generateButton" class="btn btn-primary px-4">Generate Equation</button>
                </div>
                <div id="resultPanel" class="d-none">
                    <h5 id="equationDisplay" class="text-center mb-3"></h5>
                    <table class="table table-bordered align-middle mb-0">
                        <tbody>
                            <tr><th>Coefficient a</th><td id="coefficientA"></td></tr>
                            <tr><th>Coefficient b</th><td id="coefficientB"></td></tr>
                            <tr><th>Coefficient c</th><td id="coefficientC"></td></tr>
                            <tr><th>Solution(s)</th><td id="solutionValues"></td></tr>
                            <tr><th>Server Hostname</th><td id="serverHostname"></td></tr>
                            <tr><th>Server IP Address</th><td id="serverIpAddress"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#generateButton").on("click", function () {
                $.get("/api/solve", function (response) {
                    var equationText = response.a + "x\u00B2 + " + response.b + "x + " + response.c + " = 0";
                    $("#equationDisplay").text(equationText);
                    $("#coefficientA").text(response.a);
                    $("#coefficientB").text(response.b);
                    $("#coefficientC").text(response.c);
                    $("#solutionValues").text(response.roots.join(", "));
                    $("#serverHostname").text(response.hostname);
                    $("#serverIpAddress").text(response.ip_address);
                    $("#resultPanel").removeClass("d-none");
                });
            });
        });
    </script>
</body>
</html>
